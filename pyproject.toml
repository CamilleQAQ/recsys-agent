[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-agent"
version = "0.1.0"
description = "推荐算法 Model Zoo：统一数据契约、适配层与评估口径"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
# 召回阶段的向量检索（recsys.retrieval / recsys.evaluation.faiss_evaluator）
faiss = ["faiss-cpu>=1.7.4"]
# 精排基线（第三方库；third_party/LightGBM 源码只在需要自定义编译时使用）
lightgbm = ["lightgbm>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
recsys-adapters = "recsys.adapters.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["recsys*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
