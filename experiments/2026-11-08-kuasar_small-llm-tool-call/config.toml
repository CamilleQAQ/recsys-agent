# Phase 11 验收：真实 LLM 原生 tool_calls（2026-11-08）

[task]
goal = "让真实 LLM 通过原生 tool_calls 选择一组融合配额，调用已有评测工具，读回结果并结束实验"
dataset = "kuasar_small"
fixed_users = 128
validation_targets = 362
candidate_budget_per_user = 100
baseline = "上一轮已落盘的 50/50（experiments/2026-11-08-kuasar_small-fusion-quota-agent/runs/50_50.json）"
allowed_after_baseline = [[70, 30], [30, 70], [80, 20], [20, 80]]

[protocol]
model_requests_max = 2
llm_tool_calls = 1
seconds = 180
timeout_rule = "单次请求超时 = min(30s, 剩余预算)；失败不重试"
baseline_reuse = "直接读文件并核对指纹（users/items/split/idmap/checkpoint/routing_seed/k_recall）"
context_sent_to_model = ["问题", "候选预算", "候选配额集合", "基准聚合指标", "选择规则"]
not_sent_to_model = ["原始 user_id / item_id", "候选明细", "验证标签", "密钥 / Authorization"]

[llm]
env = ["DSH_AGENT_LLM_BASE_URL", "DSH_AGENT_LLM_API_KEY", "DSH_AGENT_LLM_MODEL"]
dotenv = ".env（仓库根目录，已 gitignore；.env.example 是模板）"
dotenv_rule = "只补未设置的环境变量，优先使用进程环境变量，不打印值"
configured = false
status = "blocked: 缺少 API key，未发起任何网络请求"

[tool]
name = "evaluate_fusion_quota"
schema = "src/recsys/experiments/fusion_quota.py::tool_schema()"
execution = "程序按 tool_calls[0].function.arguments 执行；同 tool_call_id 回传结果"
guards = ["普通文本 JSON 拒绝", "tool_calls 数量必须为 1", "未知工具拒绝", "非法配额拒绝", "重复基准拒绝"]

[budget_actual]
model_requests = 0
tool_calls = 0
elapsed_s = 0.0
reason = "缺少 LLM 配置，入口在发请求前显式失败（exit 2）"

[artifacts]
experiment = "experiments/2026-11-08-kuasar_small-llm-tool-call/"
baseline_copy = "baseline.json（基准存在时写入）"
candidate_details = "artifacts/kuasar_small/llm_tool_call/cache_eval/<quota>/（未产生，因为未调用工具）"

[commands]
verify = "python -m recsys.experiments.llm_tool_call --experiment-dir experiments/2026-11-08-kuasar_small-llm-tool-call"
self_check = "python -m recsys.experiments.llm_tool_call --self-check"
powershell = "$env:DSH_AGENT_LLM_BASE_URL='https://api.deepseek.com/v1'; $env:DSH_AGENT_LLM_API_KEY='<key>'; $env:DSH_AGENT_LLM_MODEL='deepseek-chat'; python -m recsys.experiments.llm_tool_call --experiment-dir experiments/2026-11-08-kuasar_small-llm-tool-call"
