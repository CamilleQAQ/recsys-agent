category = "infrastructure"
family = "first_party"
repo = ""
code = ["src/recsys/retrieval/faiss_index.py", "src/recsys/evaluation/faiss_evaluator.py"]
license = "项目自有"
upstream_url = "本项目（自研）"
upstream_commit = ""
