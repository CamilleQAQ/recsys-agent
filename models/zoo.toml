[[models]]
id = "faiss"
name = "FAISS（向量检索）"
category = "infrastructure"
family = "vendor"
repo = "faiss"
code = ["third_party/faiss/faiss/IndexFlat.cpp", "third_party/faiss/faiss/IndexIVF.cpp", "third_party/faiss/faiss/IndexHNSW.cpp", "third_party/faiss/faiss/IndexPQ.cpp"]
license = "MIT"
upstream_url = "https://github.com/facebookresearch/faiss"
upstream_commit = "9acf8b0c16a51aafa12b9d9bcf13998b9138a8c5"
principle = "提供 Flat/IVF/PQ/HNSW/LSH 等近邻索引与聚类实现，对上游 embedding 做 Top-K 检索。"
use_cases = "召回阶段的候选生成；大规模向量打分。本身不是推荐模型。"
deps = ["faiss-cpu"]
python = ">=3.10"
train_entry = "Index.train(xb) / add(xb)（建索引即可，无需拟合）"
infer_entry = "Index.search(xq, k)"
data_format = "float32 N×d 向量；索引必须与建库时的 embedding 模型配套"
checkpoint = "index.write('x.faiss') / faiss.read_index('x.faiss')"
completeness = "ready"
completeness_note = "本项目通过 recsys.retrieval.faiss_index 调用已安装的 faiss-cpu，仓库源码仅作参考，无需本地编译"
adapter = ""
limitations = "仓库源码需 C++ 编译，本项目实际用 pip 的 faiss-cpu；索引与 embedding 必须同版本，换模型要重建索引。"

