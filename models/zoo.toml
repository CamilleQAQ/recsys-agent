[[models]]
id = "mind"
name = "MIND（多兴趣召回）"
category = "retrieval"
family = "vendor"
repo = "torch-rechub"
code = [
  "third_party/torch-rechub/torch_rechub/models/matching/mind.py",
  "third_party/torch-rechub/torch_rechub/basic/layers.py",
  "src/recsys/adapters/rechub_mind.py",
  "src/recsys/models/mind.py",
  "src/recsys/training/train_mind.py",
]
license = "MIT"
upstream_url = "https://github.com/datawhalechina/torch-rechub"
upstream_commit = "7ea1731a806ec3cb74a2c837b5bac8b04268dac6"
principle = "在双塔结构上对用户行为序列做动态路由聚类，得到多个兴趣向量分别召回后合并。"
