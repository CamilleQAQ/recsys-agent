# Model Zoo 单一事实来源（single source of truth）
#
# 本文件是全部纳入本项目的推荐模型的机读索引。docs/model-zoo.md 与
# models/<category>/README.md 都由 scripts/zoo.py 从本文件渲染；手改生成文档会被覆盖，
# 请改这里再运行：
#     python scripts/zoo.py render
#     python scripts/zoo.py check
#
# 字段约定：
#   id                 snake_case 唯一标识，适配层与后续统一接口用它做键
#   category           retrieval（召回）| ranking（排序/精排）| infrastructure（检索/向量基础设施）
#   family             first_party（本项目自研代码）| vendor（third_party 下的第三方原始代码）
#   repo               vendor 模型对应的 third_party/<repo>；first_party 留空
#   code               关键源码路径（相对项目根），check 会校验存在性
#   license            许可证标识；vendor 以仓库根 LICENSE 为准
#   upstream_url       原始地址；first_party 用本项目标记
#   upstream_commit    克隆时的 commit（浅克隆 HEAD）
#   principle          核心原理
#   use_cases          适用场景
#   deps               运行所需依赖（不含版本）
#   python             上游声明或实测的 Python 版本要求
#   train_entry        训练入口（命令或 API）
#   infer_entry        推理/打分入口
#   data_format        输入数据格式要求
#   checkpoint         模型保存/加载方式
#   completeness       ready | upstream_ready | blocked（含义见 models/README.md）
#   completeness_note  完整度的具体依据
#   adapter            统一适配层中的类名；留空表示尚未接入
#   notes              其他注意事项（可选）

version = 1
updated = "2026-11-09"

# 分类页的标题与说明（渲染 models/<category>/README.md 用）
[categories.retrieval]
title = "召回模型"
summary = "从全量物品里挑出候选集。Phase 1 已把双塔、图、序列、生成式与内容增强路线接进统一链路。"
hint = "可直接跑：popularity / matrix_factorization / two_tower / dssm / mind / lightgcn / sasrec / bert4rec / hstu / tiger / mmrec_multimodal；RQ-VAE/Semantic ID 是 TIGER 的表示层组件。OneRec / TFRS / TorchEasyRec SID 受权重或运行时限制，见各条目。"

[categories.ranking]
title = "排序模型"
summary = "对候选集做精排、CTR 预估或序列下一物品预测；LightGBM 与四个神经排序器都已接入链路。"
hint = "LightGBM 是默认精排；DIN / DIEN / DCNv2 / Ultra-HSTU 用项目特征视图与请求级候选训练。DeepFM / MMoE 留给 Phase 3 广告。"

[categories.infrastructure]
title = "基础设施"
summary = "让召回跑起来的检索与向量能力，本身不是推荐模型。"
hint = "FAISS 已接入并做过与暴力检索的一致性校验；推荐链路当前仍用精确打分，未切近似索引。TFRS 的 factorized_top_k 只作跨框架对照。"


