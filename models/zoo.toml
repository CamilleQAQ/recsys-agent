# Model Zoo 单一事实来源（single source of truth）
#
# 本文件是全部纳入本项目的推荐模型的机读索引。docs/model-zoo.md 与
# models/<category>/README.md 都由 scripts/zoo.py 从本文件渲染；手改生成文档会被覆盖，
# 请改这里再运行：
#     python scripts/zoo.py render
#     python scripts/zoo.py check
#
# 字段约定：
#   id                 snake_case 唯一标识，适配层与后续统一接口用它做键
#   category           retrieval（召回）| ranking（排序/精排）| infrastructure（检索/向量基础设施）
#   family             first_party（本项目自研代码）| vendor（third_party 下的第三方原始代码）
#   repo               vendor 模型对应的 third_party/<repo>；first_party 留空
#   code               关键源码路径（相对项目根），check 会校验存在性
#   license            许可证标识；vendor 以仓库根 LICENSE 为准
#   upstream_url       原始地址；first_party 用本项目标记
#   upstream_commit    克隆时的 commit（浅克隆 HEAD）
#   principle          核心原理
#   use_cases          适用场景
#   deps               运行所需依赖（不含版本）
#   python             上游声明或实测的 Python 版本要求
#   train_entry        训练入口（命令或 API）
#   infer_entry        推理/打分入口
#   data_format        输入数据格式要求
#   checkpoint         模型保存/加载方式
#   completeness       ready | upstream_ready | blocked（含义见 models/README.md）
#   completeness_note  完整度的具体依据
#   adapter            统一适配层中的类名；留空表示尚未接入
#   notes              其他注意事项（可选）

version = 1
updated = "2026-11-04"

# 分类页的标题与说明（渲染 models/<category>/README.md 用）
[categories.retrieval]
title = "召回模型"
summary = "从全量物品里挑出候选集。先用自研基线把数据线跑通，再换更重的模型。"
hint = "可直接跑：popularity / matrix_factorization / two_tower。LightGCN 需要先生成 RecBole atomic 文件；MIND / HSTU / 语义 ID / OneRec 需要 Linux GPU 环境与外部权重。"

[categories.ranking]
title = "排序模型"
summary = "对候选集做精排或序列下一物品预测。当前只有 SASRec 完成了端到端接入。"
hint = "DeepCTR 系列（DIN / DIEN / DCNv2 / DeepFM / MMoE）缺的是特征通道，不是模型代码；LightGBM 是最省事的精排 baseline。"

[categories.infrastructure]
title = "基础设施"
summary = "让召回跑起来的检索与向量能力，本身不是推荐模型。"
hint = "FAISS 已接入并做过与暴力检索的一致性校验；TFRS 的 factorized_top_k 只作跨框架对照。"


# ---------------------------------------------------------------- retrieval
[[models]]
id = "popularity"
name = "Popularity"
category = "retrieval"
family = "first_party"
repo = ""
code = ["src/recsys/models/popularity.py"]
license = "项目自有"
upstream_url = "本项目（自研基线）"
upstream_commit = ""
principle = "按训练集交互次数对物品排序，推荐全局最热且用户未看过的 Top-K。"
use_cases = "基线对照；任何数据集的冷启动兜底。"
deps = []
python = ">=3.11"
train_entry = "无需训练；统计来自 PreparedData.train_interactions"
infer_entry = "python -m recsys.experiments.compare（或适配层 PopularityAdapter）"
data_format = "PreparedData（连续整数 user_idx/item_idx/timestamp）"
checkpoint = "无参数，不需要保存；每次由训练集现算"
completeness = "ready"
completeness_note = "已实现，并被 compare/finalize 脚本作为对照基线使用"
adapter = "PopularityAdapter"
limitations = "只用训练集热度，无法个性化；冷门物品几乎不会被推荐，Coverage 明显偏低。"

[[models]]
id = "matrix_factorization"
name = "BPR-MF（矩阵分解）"
category = "retrieval"
family = "first_party"
repo = ""
code = ["src/recsys/models/matrix_factorization.py", "src/recsys/training/train_mf.py"]
license = "项目自有"
upstream_url = "本项目（自研基线）"
upstream_commit = ""
principle = "用户/物品各学一个隐向量，点积即偏好分数，用 BPR 负采样训练。"
use_cases = "隐式反馈基线；召回通道的最小可用模型。"
deps = ["torch"]
python = ">=3.11"
train_entry = "python -m recsys.training.train_mf --dataset kuairec"
infer_entry = "python -m recsys.evaluation.evaluator --checkpoint artifacts/<dataset>/matrix_factorization.pt"
data_format = "PreparedData；评测用 seen-mask 过滤已曝光物品"
checkpoint = "artifacts/<dataset>/matrix_factorization.pt（model_config + model_state_dict + train_config）"
completeness = "ready"
completeness_note = "训练、checkpoint、评测入口齐全"
adapter = "MatrixFactorizationAdapter"
limitations = "只学 ID 隐向量，用不上特征与序列；负样本随机采样、未做热度校正，长尾物品学到的东西很少。"

[[models]]
id = "two_tower"
name = "Two-Tower（ID 双塔）"
category = "retrieval"
family = "first_party"
repo = ""
code = ["src/recsys/models/two_tower.py", "src/recsys/training/trainer.py"]
license = "项目自有"
upstream_url = "本项目（自研）"
upstream_commit = ""
principle = "用户塔/物品塔各自编码并 L2 归一化，用 batch 内负样本的交叉熵训练，内积即余弦相似度。"
use_cases = "召回主干；可对接 FAISS 做全量 Top-K。"
deps = ["torch", "faiss-cpu（可选）"]
python = ">=3.11"
train_entry = "python -m recsys.training.trainer --dataset kuairec"
infer_entry = "python -m recsys.evaluation.evaluator --checkpoint artifacts/<dataset>/two_tower.pt"
data_format = "PreparedData；物品词表必须与 checkpoint 一致"
checkpoint = "artifacts/<dataset>/two_tower.pt（自带 model_config 与 split_strategy 校验）"
completeness = "ready"
completeness_note = "训练/暴力评测/FAISS 评测均已实现"
adapter = "TwoTowerAdapter"
limitations = "只吃 ID 特征，KuaiSAR 的行为/上下文特征尚未接入；batch 内负样本会带来假负例（mask_false_negatives 可缓解但无法消除）。"

[[models]]
