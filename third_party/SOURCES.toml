# third_party 来源清单（维护版，机器可读）
#
# repository_manifest.csv 是 Phase 0 静态审计时的**快照**（由 build_audit.py 生成，含实现文件与符号级证据），
# 本文件是后续持续维护的来源清单：新增仓库先在这里登记，再由
# python scripts/check_project.py 校验「目录 ↔ 条目 ↔ 许可证文件 ↔ commit 格式」是否一致。
#
# 字段：
#   name           third_party 下的目录名
#   url            原始 GitHub 地址
#   branch         克隆时的默认分支
#   commit         完整 SHA（40 位）
#   license        许可证（以仓库根 LICENSE 为准）
#   license_file   仓库根许可证文件名；空字符串表示上游缺失
#   coverage       模型/能力覆盖
#   usability      在本项目里的可用性结论
#   local_changes  相对上游的本地改动（只允许删除缓存/数据、加说明文件）
#   added          纳入日期

