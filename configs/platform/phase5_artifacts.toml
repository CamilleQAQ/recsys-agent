# Phase 5 工件清单（演示与恢复只读使用）
#
# 这份清单只登记「实际被业务链路加载的文件」，不是模型库索引。
# 每条包含：业务、角色、路径、来源、大小、sha256，以及已有的校验出处
# （checksum_recorded_in）和可机检的 metadata。
#
# 校验规则（recsys.platform.artifacts.verify_manifest）：
#   1. 路径必须存在且是文件；
#   2. size_bytes 与 sha256 必须一致；
#   3. metadata 中的结构字段（num_docs / vocab_size / num_items / dim /
#      weight_kind / stats 等）必须与文件内容一致。
# 任何一条不满足都会报出具体文件并失败；不会训练、换模型或重建索引。
#
# 重新生成 sha256 的方法见 README「Phase 5 工件恢复」一节。

