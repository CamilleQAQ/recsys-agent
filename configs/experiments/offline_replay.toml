# Phase 13 Offline Replay MVP：融合配额受控回放（2026-11-09）
#
# 只读已有汇总 JSON；不训练、不重新召回、不重新评测、不调用真实 LLM。
# 配额统一按「双塔 / MIND」解释。

schema_version = 1

[replay]
phase = "Phase 13 Offline Replay MVP"
question = "在 kuasar_small 的 128 个验证用户上，给定同一份 50/50 起始历史与 2 次揭晓预算，Rec Agent 与固定策略各自会选择哪个融合配额？"
dataset = "kuasar_small"
split = "validation"
split_strategy = "per_user_last_two_requests"
split_evidence = "128 个固定用户 / 362 个验证目标；per_user_last_two_requests；所有来源的 split_sha256 完全一致"
baseline_quota = "50/50"
allowed_quotas = ["70/30", "30/70", "20/80", "80/20"]
budget_reveals_per_side = 2
candidate_pool_per_user = 100
expected_users = 128
expected_targets = 362
expected_fills = 0
fusion_rule_version = "fusion_quota_v1"
metric_definition = "hits=(user,item) 命中对计数；recall_at_100=evaluate_recommendations(ks=(100,)) 的用户平均 Recall@100"

[best_rule]
primary = "recall_at_100"
recall_decimals = 6
tie_break_1 = "closer_to_50_50"
tie_break_2 = "two_tower_quota_ascending"
coverage = "descriptive_only"
description = "先比较 Recall@100；并列时选更接近 50/50 的配额；仍并列时按双塔配额从小到大；覆盖率仅作描述"

[fixed_policy]
name = "fixed_symmetric_probe"
order = ["70/30", "30/70"]
description = "以 50/50 为中心的对称试探，顺序预先写入配置，不根据回放结果调整"
stop_rule = "预设顺序执行完毕（预算同时耗尽）"

[agent_policy]
name = "local_feedback_v1"
first_step = "在未揭晓候选中选与 50/50 的 L1 距离最小者；并列时双塔配额较小者优先"
better_step = "若第一步 Recall@100 高于当前最佳，沿同一方向再探一档（30/70→20/80，70/30→80/20）"
worse_step = "若第一步 Recall@100 低于当前最佳，转向跨 50/50 的镜像配额（30/70→70/30，70/30→30/70）"
tie_step = "若第一步 Recall@100 与当前最佳持平，视为未显示方向性收益，立即停止"
stop_rules = [
  "预算用完",
  "第一步 Recall@100 与当前最佳持平",
  "同方向没有未揭晓候选",
  "没有未揭晓候选",
]
feedback_inputs = "起始 50/50 历史 + 本侧已揭晓结果 + 剩余预算；第二步必须读取第一步的工具返回"
prohibited_inputs = "完整结果表、来源报告、项目全局实验记忆、对方轨迹、已知最优配额、完整试验顺序"

[scope]
mode = "offline replay over existing summary JSON only"
training = 0
recall = 0
real_evaluation = 0
llm_requests = 0
network_requests = 0
dataset_files_read = 0
candidate_detail_files_read = 0
cache_files_read = 0
memory_index_read = 0
other_side_trace_read = 0
old_evidence_modified = false

[commands]
main = "python -m recsys.experiments.offline_replay"
self_check = "python -m recsys.experiments.offline_replay --self-check"
llm_main = "python -m recsys.experiments.offline_replay_llm"
llm_self_check = "python -m recsys.experiments.offline_replay_llm --self-check"

# 真实 LLM 工作流：只跑一次，最多 3 次模型请求；不自动重试。
[llm]
max_model_requests = 3
max_tool_calls = 2
request_timeout_s = 30.0
total_budget_s = 180.0
tool_name = "get_fusion_result"
temperature = 0.0
parallel_tool_calls = false
model_env = "DSH_AGENT_LLM_MODEL"
base_url_env = "DSH_AGENT_LLM_BASE_URL"
api_key_env = "DSH_AGENT_LLM_API_KEY"

# 上一轮已验收的本地规则 Agent 与固定策略轨迹；本轮只引用、不重跑。
[frozen_baselines]
previous_run = "experiments/2026-11-09-kuasar_small-offline-replay/run-20261109T020944Z-20800"
local_agent_trace = "experiments/2026-11-09-kuasar_small-offline-replay/run-20261109T020944Z-20800/agent_trace.json"
fixed_trace = "experiments/2026-11-09-kuasar_small-offline-replay/run-20261109T020944Z-20800/fixed_trace.json"
metrics = "experiments/2026-11-09-kuasar_small-offline-replay/run-20261109T020944Z-20800/metrics.json"
sources = "experiments/2026-11-09-kuasar_small-offline-replay/run-20261109T020944Z-20800/sources.json"

