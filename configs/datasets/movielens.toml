# MovieLens-1M（快速上手用数据集）
#
# 与 KuaiRec 共用同一套 PreparedData 契约，只换读取器和正反馈阈值。

[dataset]
name = "movielens"
display_name = "MovieLens-1M"
domain = "电影评分"
source_url = "https://files.grouplens.org/datasets/movielens/ml-1m.zip"
archive_md5 = ""
license = "GroupLens 研究许可；再分发需遵守其条款"

[layout]
root = "data"
raw = "data/raw"
processed = "data/processed"
ratings = "raw/ml-1m/ratings.dat"

[labels]
positive_field = "rating"
positive_threshold = 4
note = "评分 >= 4 记为喜欢；阈值改动会让历史 checkpoint 失效"

[split]
strategy = "per_user_last_two_strict_timestamp_v2"
validation = "每个用户倒数第二个正反馈"
test = "每个用户最后一个正反馈"

[evaluation]
seen_mask = "训练/验证历史中已出现的物品"
metrics = ["Recall@k", "NDCG@k", "HitRate@k"]
